<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Safe V-Way</title>

  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <header id="topbar">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#C4161C"/><path d="M9 25V15h10" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="square" stroke-linejoin="miter"/><circle cx="23" cy="15" r="3.6" fill="#fff"/></svg>
    <div class="id">
      <span class="brand">Safe V-Way</span>
      <span class="sub">Gen. T. De Leon, Valenzuela</span>
    </div>
    <span id="status" class="status offline" title="Connection to server">
      <span class="dot"></span><span id="status-text">connecting...</span>
    </span>
  </header>

  <div id="map"></div>

  <!-- Button to start a hazard report -->
  <button id="report-btn" type="button">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 22 20H2z"/><path d="M12 10v4.5" stroke-linecap="butt"/><circle cx="12" cy="17.3" r=".6" fill="currentColor"/></svg>
    Report a hazard
  </button>

  <!-- Routing panel (from Step 3) -->
  <section id="panel" class="idle">
    <h2 id="panel-title">Tap the map where you are</h2>
    <p id="panel-detail">We will show the shortest walking route to the nearest safe zone that still has space.</p>
    <p id="panel-note" class="note" hidden></p>
    <button id="clear-btn" type="button" hidden>Clear route</button>
  </section>

  <!-- Report sheet. Replaces the routing panel while the resident is reporting. -->
  <section id="report-sheet" hidden>
    <h2>Report a hazard</h2>
    <p id="report-hint">Step 1: Tap the map to mark where the hazard is (for example, a blocked alley or a fire).</p>

    <!-- The form only appears after the resident has picked a spot -->
    <form id="report-form" hidden>
      <label for="report-desc">What is happening here?</label>
      <textarea id="report-desc" rows="3" maxlength="300"
                placeholder="Example: Fallen post blocking the alley beside the sari-sari store"></textarea>

            <label>Photo (optional)</label>
      <div class="row">
        <button type="button" id="photo-cam-btn" class="secondary"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h4l1.5-2.5h7L17 8h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg> Take photo</button>
        <button type="button" id="photo-gal-btn" class="secondary"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="m3 17 5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.6"/></svg> Gallery</button>
      </div>
      <p id="photo-name" class="photo-name">No photo selected</p>
      <!-- Hidden file inputs. The buttons above open them.
           capture="environment" = open the back camera directly. -->
      <input id="report-photo-cam" type="file" accept="image/*" capture="environment" hidden>
      <input id="report-photo" type="file" accept="image/*" hidden>

      <p id="report-error" class="form-error" hidden></p>

      <div class="row">
        <button type="submit" id="report-send">Send report</button>
        <button type="button" id="report-cancel-2" class="secondary">Cancel</button>
      </div>
    </form>

    <!-- Shown before a spot is picked -->
    <button type="button" id="report-cancel-1" class="secondary">Cancel</button>
  </section>

  <div id="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/js/resident.js"></script>
</body>
</html>
